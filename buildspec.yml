version: 0.2

phases:
  install:
    runtime-versions:
      python: 3.9
    commands:
      - pip install cfn-lint taskcat

  pre_build:
    commands:
      - aws s3 cp s3://mys3bucket/vpc-cfn.yaml ./ || true
      - aws s3 cp s3://mys3bucket/nat-cfn.yaml ./ || true
      - aws s3 cp s3://mys3bucket/rt-cfn.yaml ./ || true
      - aws s3 cp s3://mys3bucket/sg-cfn.yaml ./ || true
      - aws s3 cp s3://mys3bucket/eks-cfn.yaml ./ || true
      - cfn-lint infras/aws/cfn_nested_templates/*.yaml main-cfn.yaml

  build:
    commands:
      - mkdir -p taskcat_outputs
      - taskcat test run || true
      - if [ $? -ne 0 ]; then
          cp -r ~/.taskcat/ taskcat_outputs/ 2>/dev/null || true;
          echo "TaskCat test finished - logs copied to artifacts";
        fi

reports:
  taskcat-report:
    files:
      - '*/'
    base-directory: taskcat_outputs

artifacts:
  files:
    - '*/'
    - '**/*'
  base-directory: taskcat_outputs
  name: taskcat-test-output
