AWSTemplateFormatVersion: 2010-09-09
Description: This template creates Nested stack including VPC, NAT, Route Tables, Security Groups, and EKS Cluster

Parameters:
  AllowedSSHIP:
    Description: The IP address allowed to SSH to the public EC2 instances
    Type: String
    Default: 0.0.0.0/0

  InstanceType:
    Description: EC2 instance type for EKS worker nodes
    Type: String
    Default: t3.medium
    AllowedValues:
      - t3.small
      - t3.medium
      - t3.large
      - t2.micro
      - t2.small
      - t2.medium

  TemplateBucketName:
    Description: Name of the S3 bucket containing nested stack templates
    Type: String
    Default: mys3bucket

  TemplateVersion:
    Description: Version or path prefix for the templates in S3
    Type: String
    Default: ""

  EnvironmentName:
    Description: Environment name - used to make resource names unique
    Type: String
    Default: prod

Resources:        
  VPCStack:
    Type: AWS::CloudFormation::Stack
    Properties:
      TemplateURL: !Sub https://${TemplateBucketName}.s3.amazonaws.com/${TemplateVersion}vpc-cfn.yaml
      TimeoutInMinutes: 10
      Parameters:
        EnvironmentName: !Ref EnvironmentName

  NATStack:
    Type: AWS::CloudFormation::Stack
    DependsOn: VPCStack
    Properties:
      TemplateURL: !Sub https://${TemplateBucketName}.s3.amazonaws.com/${TemplateVersion}nat-cfn.yaml
      TimeoutInMinutes: 10
      Parameters:
        EnvironmentName: !Ref EnvironmentName

  RouteTablesStack:
    Type: AWS::CloudFormation::Stack
    DependsOn:
      - VPCStack
      - NATStack
    Properties:
      TemplateURL: !Sub https://${TemplateBucketName}.s3.amazonaws.com/${TemplateVersion}rt-cfn.yaml
      TimeoutInMinutes: 10
      Parameters:
        EnvironmentName: !Ref EnvironmentName

  SecurityGroupsStack:
    Type: AWS::CloudFormation::Stack
    DependsOn: VPCStack
    Properties:
      TemplateURL: !Sub https://${TemplateBucketName}.s3.amazonaws.com/${TemplateVersion}sg-cfn.yaml
      TimeoutInMinutes: 10
      Parameters:
        AllowedSSHIP: !Ref AllowedSSHIP
        EnvironmentName: !Ref EnvironmentName

  EKSStack:
    Type: AWS::CloudFormation::Stack
    DependsOn:
      - VPCStack
      - RouteTablesStack
      - NATStack
    Properties:
      TemplateURL: !Sub https://${TemplateBucketName}.s3.amazonaws.com/${TemplateVersion}eks-cfn.yaml
      TimeoutInMinutes: 25
      Parameters:
        EnvironmentName: !Ref EnvironmentName
        ClusterName: guestbook-cluster
        KubernetesVersion: "1.30"
        NodeInstanceType: !Ref InstanceType

Outputs:
  EKSClusterName:
    Description: EKS Cluster Name
    Value: !GetAtt EKSStack.Outputs.ClusterName

  EKSClusterEndpoint:
    Description: EKS Cluster API Endpoint
    Value: !GetAtt EKSStack.Outputs.ClusterEndpoint
